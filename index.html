<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e22">
  <meta name="description" content="滅びかけた世界の待機室で、記憶をなくした英雄たちを導き、100階の塔を制覇するゲーム">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="星喚の塔">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>星喚の塔</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 待機室（ゲームの中で映すのはここだけ） -->
    <div id="scene" class="scene" aria-label="待機室。建物や英雄をタップできる"></div>
    <header id="hud" class="hud">
      <button type="button" id="world-name" class="world-name" data-action="rename" aria-label="待機室の名前（タップで変更）">…</button>
      <div class="wallet">
        <span class="coin" title="召喚石"><span aria-hidden="true">💎</span><span class="sr-only">召喚石</span><b id="gems">0</b></span>
        <span class="coin" title="金貨"><span aria-hidden="true">🪙</span><span class="sr-only">金貨</span><b id="gold">0</b></span>
        <span class="coin" title="星の欠片"><span aria-hidden="true" class="shard">✦</span><span class="sr-only">星の欠片</span><b id="shards">0</b></span>
      </div>
      <div id="notices" class="notices" aria-live="polite"></div>
      <div class="cam-tools" aria-label="視点">
        <button type="button" data-action="cam" data-v="l" aria-label="左に回す">⟲</button>
        <button type="button" data-action="cam" data-v="r" aria-label="右に回す">⟳</button>
        <button type="button" data-action="cam" data-v="in" aria-label="寄る">＋</button>
        <button type="button" data-action="cam" data-v="out" aria-label="引く">－</button>
        <button type="button" data-action="help" aria-label="遊び方">？</button>
      </div>
    </header>

    <!-- 塔の中（マスターが見ている映像） -->
    <div id="expedition" class="expedition" hidden>
      <div id="field" class="scene" aria-label="塔の中の映像。英雄や敵、地面をタップできる"></div>
      <div class="x-top">
        <b id="x-floor">1階</b><span id="x-time"></span>
        <span id="x-gauge" class="gauge" role="status"><i></i></span>
        <div class="x-tools">
          <button type="button" id="x-order" class="chip" aria-pressed="false">指示</button>
          <button type="button" id="x-speed" class="chip">×2</button>
          <button type="button" id="x-tactics" class="chip">作戦</button>
          <button type="button" id="x-retreat" class="chip chip-dim">撤退</button>
        </div>
        <p id="x-mission" class="x-mission">任務: ？？？</p>
      </div>
      <div id="x-banner" class="banner" aria-live="polite"></div>
      <div id="x-proposal" class="x-proposal" hidden></div>
      <div id="x-list" class="x-list" aria-label="英雄の様子"></div>
      <div id="x-cmd" class="x-cmd" hidden></div>
      <div class="cam-tools x-cam" aria-label="視点">
        <button type="button" data-action="cam" data-v="all" aria-label="全員を映す">◎</button>
        <button type="button" data-action="cam" data-v="l" aria-label="左に回す">⟲</button>
        <button type="button" data-action="cam" data-v="r" aria-label="右に回す">⟳</button>
        <button type="button" data-action="cam" data-v="in" aria-label="寄る">＋</button>
        <button type="button" data-action="cam" data-v="out" aria-label="引く">－</button>
      </div>
      <ol id="x-log" class="x-log" aria-live="polite"></ol>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- 外部ライブラリ（MIT ライセンス）: three.js r147 と、その後処理、pixelfx -->
  <script src="js/lib/three.min.js"></script>
  <script src="js/lib/Pass.js"></script>
  <script src="js/lib/CopyShader.js"></script>
  <script src="js/lib/LuminosityHighPassShader.js"></script>
  <script src="js/lib/HorizontalTiltShiftShader.js"></script>
  <script src="js/lib/VerticalTiltShiftShader.js"></script>
  <script src="js/lib/VignetteShader.js"></script>
  <script src="js/lib/EffectComposer.js"></script>
  <script src="js/lib/RenderPass.js"></script>
  <script src="js/lib/ShaderPass.js"></script>
  <script src="js/lib/UnrealBloomPass.js"></script>
  <script src="js/lib/pixelfx.js"></script>
  <!-- ゲーム -->
  <script src="js/data.js"></script>
  <script src="js/herogen.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/room.js"></script>
  <script src="js/field.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
